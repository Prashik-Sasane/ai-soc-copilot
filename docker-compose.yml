services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai_soc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_soc_db
      POSTGRES_USER: ai_soc_user
      POSTGRES_PASSWORD: 12410279
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_soc_user -d ai_soc_db"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_soc_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # NOTE: postgresql+psycopg2:// explicitly uses psycopg2 (v2) driver which matches requirements.txt
      # Also supports postgresql+psycopg:// if using psycopg v3 driver
      - DATABASE_URL=postgresql+psycopg2://ai_soc_user:12410279@db:5432/ai_soc_db
      - SECRET_KEY=production_secret_key_change_in_prod_min_32_bytes_long_abc123
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - ENABLE_DEMO_SEEDING=${ENABLE_DEMO_SEEDING:-false}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-mock}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-gemini-embedding-001}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash}
      - VT_API_KEY=${VT_API_KEY:-}
      - OTX_API_KEY=${OTX_API_KEY:-}
      - TI_CACHE_TTL_MINUTES=${TI_CACHE_TTL_MINUTES:-60}
      - INGEST_WEBHOOK_TOKENS=${INGEST_WEBHOOK_TOKENS:-webhook-default:dev-ingest-token}
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://frontend:3000
      - API_V1_STR=/api/v1
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* must be baked at BUILD TIME - Next.js inlines them into client bundles
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    container_name: ai_soc_frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      # Runtime env vars (server-side only; client side uses baked NEXT_PUBLIC_ above)
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NODE_ENV=production
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
