version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai_soc_postgres
    restart: always
    environment:
      POSTGRES_DB: ai_soc_db
      POSTGRES_USER: ai_soc_user
      POSTGRES_PASSWORD: ai_soc_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_soc_user -d ai_soc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_soc_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ai_soc_user:ai_soc_password@db:5432/ai_soc_db
      - SECRET_KEY=production_secret_key_change_in_prod
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_soc_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
